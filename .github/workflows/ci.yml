name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Upstream chardet commit this port is validated against (chardet 7.6.1.dev).
  CHARDET_REF: e9603fad69cdc5d34d03616682650acd4891eb5d

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: Rust build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  python:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: chardet-py
        run: maturin build --release
      - name: Install wheel
        run: pip install target/wheels/*.whl
      - name: Smoke test
        run: |
          python - <<'PY'
          import chardet
          from chardet.enums import EncodingEra
          from chardet.pipeline import DetectionResult
          r = chardet.detect("café".encode("cp1252"))
          assert r["encoding"] == "Windows-1252", r
          assert chardet.detect(b"hello")["encoding"] == "ascii"
          assert chardet.UniversalDetector is not None
          assert isinstance(EncodingEra.ALL, int)
          print("smoke ok", chardet.__version__)
          PY

  parity:
    name: Parity vs chardet 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check out reference chardet
        run: |
          git init -q /tmp/ref-chardet
          git -C /tmp/ref-chardet remote add origin https://github.com/chardet/chardet.git
          git -C /tmp/ref-chardet fetch -q --depth 1 origin "$CHARDET_REF"
          git -C /tmp/ref-chardet checkout -q FETCH_HEAD
          echo '__version__ = "7.6.1.dev0"' > /tmp/ref-chardet/src/chardet/_version.py
          python -c "import sys; sys.path.insert(0, '/tmp/ref-chardet/src'); import chardet; print('reference chardet', chardet.__version__)"
      - name: Build
        run: cargo build
      - name: Samples
        env:
          CHARDET_SRC: /tmp/ref-chardet/src
          CHARDET_BIN: target/debug/chardetect
        run: python scripts_compare/parity.py
      - name: Edge cases
        env:
          CHARDET_SRC: /tmp/ref-chardet/src
          CHARDET_BIN: target/debug/chardetect
        run: python scripts_compare/edge_parity.py
      - name: Fuzz (seeds)
        env:
          CHARDET_SRC: /tmp/ref-chardet/src
          CHARDET_BIN: target/debug/chardetect
        run: |
          for seed in 1 777 12345 424242; do
            python scripts_compare/fuzz.py "$seed" 500
          done

  full-corpus:
    name: Full corpus (chardet/test-data)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check out reference chardet and corpus
        run: |
          git init -q /tmp/ref-chardet
          git -C /tmp/ref-chardet remote add origin https://github.com/chardet/chardet.git
          git -C /tmp/ref-chardet fetch -q --depth 1 origin "$CHARDET_REF"
          git -C /tmp/ref-chardet checkout -q FETCH_HEAD
          echo '__version__ = "7.6.1.dev0"' > /tmp/ref-chardet/src/chardet/_version.py
          git clone --depth 1 https://github.com/chardet/test-data tests/data
      - name: Build
        run: cargo build
      - name: Full-corpus regression
        env:
          CHARDET_SRC: /tmp/ref-chardet/src
          CHARDET_BIN: target/debug/chardetect
        run: python scripts_compare/full_corpus.py tests/data
