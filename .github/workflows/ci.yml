name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  python:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: chardet-py
        run: maturin build --release
      - name: Install wheel
        run: pip install ../target/wheels/chardet-*.whl
      - name: Smoke test
        run: |
          python - <<'PY'
          import chardet
          from chardet.enums import EncodingEra
          from chardet.pipeline import DetectionResult
          r = chardet.detect("café".encode("cp1252"))
          assert r["encoding"] == "Windows-1252", r
          assert chardet.detect(b"hello")["encoding"] == "ascii"
          assert chardet.UniversalDetector is not None
          assert isinstance(EncodingEra.ALL, int)
          print("smoke ok", chardet.__version__)
          PY

  parity:
    name: Parity vs chardet 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reference chardet + build
        run: |
          pip install "chardet>=7"
          python -c "import chardet; print('reference chardet', chardet.__version__)"
          cargo build
      - name: Samples
        env:
          CHARDET_BIN: target/debug/chardetect
        run: python scripts_compare/parity.py
      - name: Edge cases
        env:
          CHARDET_BIN: target/debug/chardetect
        run: python scripts_compare/edge_parity.py
      - name: Fuzz (seeds)
        env:
          CHARDET_BIN: target/debug/chardetect
        run: |
          for seed in 1 777 12345 424242; do
            python scripts_compare/fuzz.py "$seed" 500
          done

  full-corpus:
    name: Full corpus (chardet/test-data)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clone corpus
        run: git clone --depth 1 https://github.com/chardet/test-data tests/data
      - name: Reference chardet + build
        run: |
          pip install "chardet>=7"
          cargo build
      - name: Full-corpus regression
        env:
          CHARDET_BIN: target/debug/chardetect
        run: python scripts_compare/full_corpus.py tests/data
